name: Release
# Pushing a tag v<VERSION> releases that version, but only after the checks every push gets have passed on the tagged
# commit. The release is made as a draft first. Its files are then downloaded from the draft, their hashes and
# attestations checked, and the downloaded Setup installed with no Python on the PATH and started once. Only then is the
# draft published. When anything fails, nothing is published: delete the draft, fix the problem and release the next
# patch number (CONTRIBUTING.md, "Making a release"). The release carries Setup, built from the tag, and SHA256SUMS, with
# a GitHub attestation of where both came from. Adapted from NPC Forge's and Voice Lab's release workflows, as the suite
# contract's release kit asks.
on:
  push:
    tags: ['v*.*.*']
  # To release an existing tag again after a failure that was not the code's, such as GitHub being down.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v1.0.0
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/checks.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
  draft:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
      # For the attestation of the release files (actions/attest).
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      # Check for updates compares the tag with core/version.py, so a tag that is not v<VERSION> is refused here first.
      - name: Check the tag and write the notes from the changelog
        run: python scripts/release_notes.py --tag "$env:TAG" --output "$env:RUNNER_TEMP\notes.md"
      # Inno Setup is on the runner. The files are built before anything is made on GitHub, so a failed build makes
      # nothing.
      - name: Build Setup and SHA256SUMS from the tag
        run: python scripts/build_installer.py --tag "$env:TAG" --output "$env:RUNNER_TEMP\release"
      - name: Attest where the release files came from
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/FelsAltera-Setup-*.exe
            ${{ runner.temp }}/release/SHA256SUMS
      - name: Make the release as a draft
        run: |
          # A draft left by an earlier run for this tag is replaced. A published release is never changed.
          $state = gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>$null
          if ($state -eq 'false') { throw "$env:TAG is already published. Release the next patch number instead." }
          if ($state -eq 'true') {
            gh release delete "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --yes
            if ($LASTEXITCODE) { throw "The earlier draft for $env:TAG could not be deleted" }
          }
          $version = $env:TAG.Substring(1)
          $files = "$env:RUNNER_TEMP\release\FelsAltera-Setup-$version.exe", "$env:RUNNER_TEMP\release\SHA256SUMS"
          gh release create "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --draft --verify-tag --title "Fel's Altera $version" --notes-file "$env:RUNNER_TEMP\notes.md" @files
          if ($LASTEXITCODE) { throw "The draft for $env:TAG could not be made" }
  check:
    # What people will download, checked as they will get it: the draft's own files, on a runner that did not build them.
    needs: draft
    runs-on: windows-latest
    permissions:
      # A draft release can be read only with write access.
      contents: write
      attestations: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download the release files from the draft
        run: |
          gh release download "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --dir "$env:RUNNER_TEMP\draft"
          if ($LASTEXITCODE) { throw "The draft's files could not be downloaded" }
      - name: Check their hashes and attestations
        run: python scripts/check_release_files.py --dir "$env:RUNNER_TEMP\draft" --tag "$env:TAG" --repo "$env:GITHUB_REPOSITORY"
      - name: Install the downloaded Setup with no Python on the PATH, then start Altera once
        run: |
          $setup = (Get-Item "$env:RUNNER_TEMP\draft\FelsAltera-Setup-*.exe").FullName
          $installed = "$env:RUNNER_TEMP\installed"
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          $run = Start-Process -WindowStyle Hidden -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALTERAUPDATE=1', '/TASKS=',
            "/DIR=""$installed""", "/LOG=""$env:RUNNER_TEMP\installer.log"""
          ) -PassThru -Wait
          if ($run.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\installer.log" -Tail 45
            if (Test-Path "$installed\setup.log") { Get-Content "$installed\setup.log" -Tail 45 }
            throw "Setup returned $($run.ExitCode)."
          }
          $version = $env:TAG.Substring(1)
          $release = "$installed\releases\$version"
          $python = "$release\.venv\Scripts\python.exe"
          & $python -I -c "import sys, flask, waitress; assert sys.version_info[:2] == (3, 12)"
          if ($LASTEXITCODE) { throw "The bundled Python did not load Altera's dependencies." }
          # Started the way the Start menu entry starts it (scripts/windows_install.py), without opening a browser.
          $env:ALTERA_HOME = "$installed\instance"
          $env:ALTERA_DISABLE_AUTOSTART = '1'
          $env:FELS_SUITE_DIR = "$env:RUNNER_TEMP\fels"
          $app = Start-Process -FilePath $python -ArgumentList '-B', 'altera.py' -WorkingDirectory $release -PassThru `
            -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\altera.txt" -RedirectStandardError "$env:RUNNER_TEMP\altera-err.txt"
          $health = $null
          foreach ($try in 1..60) {
            try { $health = Invoke-RestMethod 'http://127.0.0.1:8767/api/health' -TimeoutSec 3; break } catch { Start-Sleep 2 }
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $health) {
            Get-Content "$env:RUNNER_TEMP\altera.txt", "$env:RUNNER_TEMP\altera-err.txt" -Tail 40 -ErrorAction SilentlyContinue
            throw 'The installed Altera did not answer on port 8767.'
          }
          if ($health.fels.version -ne $version) { throw "The installed Altera reports $($health.fels.version), not $version." }
          "The installed Altera $version answered on port 8767."
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      # Check for updates asks GitHub for the latest release, so the newest version is marked latest. A patch to an older
      # version, released after a newer one, is not.
      - name: Publish the checked draft
        run: |
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" = "$TAG" ]; then latest=true; else latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
