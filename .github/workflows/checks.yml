name: Checks
on:
  push:
    # Branches only: a pushed tag is checked by release.yml, which calls this workflow before it builds anything.
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check, such as refs/tags/v1.0.0. Empty checks the caller's own commit.
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      ALTERA_DISABLE_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: node scripts/check_frontend.cjs
